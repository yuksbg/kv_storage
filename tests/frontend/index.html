<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KV Storage preview</title><style>
body{margin:0;--primary-color:#03a9f4;--primary-text-color:#e7e7e7;--secondary-text-color:#aaa;--primary-background-color:#111;--secondary-background-color:#252525;--card-background-color:#1c1c1c;--divider-color:#383838;--error-color:#ef7670;--text-primary-color:#fff;font-family:Arial,sans-serif;color-scheme:dark;}kv-storage-panel{height:100vh}body.light{--primary-text-color:#212121;--secondary-text-color:#666;--primary-background-color:#fafafa;--secondary-background-color:#f1f1f1;--card-background-color:white;--divider-color:#ddd;--error-color:#b00020;color-scheme:light;}
</style><kv-storage-panel></kv-storage-panel><script type="module">
import '/custom_components/kv_storage/frontend/kv-storage-panel.js';
const params=new URLSearchParams(location.search);
if(params.has('light'))document.body.classList.add('light');
const panel=document.querySelector('kv-storage-panel');
const values={my_store:{bathroom_last_humidity:34,bathroom_mode:'idle',bathroom_shower:false,door_code:'0012',washer_cycle_active:true,washer_energy_start:12.48,preferences:{rooms:['kitchen','hallway'],enabled:true}},weekend:{}};
if(params.has('security'))values.my_store['<script>alert(1)<\/script>']='<img src=x onerror=alert(1)>';
const hass={states:{},async callWS({service_data:{store}}){if(params.has('read-error'))throw Error('Store temporarily unavailable');return {response:{store,values:structuredClone(values[store])}}},async callService(domain,service,{store,key,value}){if(params.has('write-error'))throw Error('SQLite write failed; value was not updated');if(service==='set')values[store][key]=value;else delete values[store][key];update();}};
function update(){hass.states=params.has('empty')?{}:Object.fromEntries(Object.entries(values).map(([name,data])=>['sensor.'+name,{entity_id:'sensor.'+name,state:String(Object.keys(data).length),attributes:{...data,kv_storage_store:name}}]));panel.hass=hass;}update();
</script></html>
